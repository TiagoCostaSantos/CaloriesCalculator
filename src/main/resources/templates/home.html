<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    /* Borda em todas as células */
    .tabela-produtos,
    .tabela-produtos th,
    .tabela-produtos td {
      border: 1px solid #ccc; /* borda cinza clara */
      border-collapse: collapse; /* evita bordas duplas */
    }

    /* Padding para deixar o conteúdo mais agradável */
    .tabela-produtos th,
    .tabela-produtos td {
      padding: 8px 12px;
      text-align: left;
    }

    /* Largura e centralização */
    .tabela-produtos {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    /* Cabeçalho com fundo leve */
    .tabela-produtos th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
<center><br><br><br>
  <h1>Buscar Produto Alimenticio</h1>
  <form th:action="@{/produto-alimenticio/BuscarProdutoApi}" th:String="${produtoAlimenticio}" method="get">
    Digite o produto alimenticio para busca: <input type="text" name="produtoAlimenticio" th:String="*{produtoAlimenticio}"><button type="submit">Pesquisar</button>
  </form>

  <br>
  <br>
  <table class="tabela-produtos">
    <tr>
      <th>Produto</th>
      <th>Categoria</th>
      <th>Kcal</th>
      <th>Carboidratos</th>
      <th>Proteinas</th>
      <th></th>
    </tr>
    <tr th:each="p : ${ProdutosLista}">
      <td th:text="${p.name}"></td>
      <td th:text="${p.category.name}"></td>
      <td th:text="${p.nutrients.kcal}"></td>
      <td th:text="${p.nutrients.carbohydrates}"></td>
      <td th:text="${p.nutrients.protein}"></td>
      <td>Adicionar a dieta</td>
    </tr>
  </table>
  <br>Não encontrou o produto que deseja? <a href="produto-alimenticio/Cadastrar"> + Cadastrar</a>
</center>
</body>
</html>
