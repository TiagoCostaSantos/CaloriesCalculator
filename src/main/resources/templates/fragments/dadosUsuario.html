<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/styleIndex.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Fragmentos do form DadosUsuario</title>
</head>
<body>
<div class="scrollable-div" th:fragment="conteudo">

    <div th:if="${erros}" class="alert alert-danger mt-3">
        <ul class="mb-0">
            <li th:each="erro : ${erros}" th:text="${erro.defaultMessage}"></li>
        </ul>
    </div>

    <form id="formEnviar"
          method="post"
          th:action="@{/usuario/salvarDados}"
          th:object="${dadosUsuarioModel}">

        <div class="row g-3 mt-1">

            <div class="col-md-6">
                <label class="form-label fw-bold">Peso (kg)</label>
                <input th:field="*{peso}" type="number" step="0.1"
                       class="form-control" placeholder="70">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Altura (cm)</label>
                <input th:field="*{altura}" type="number" step="0.1"
                       class="form-control" placeholder="184">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Sexo</label>
                <select th:field="*{sexo}" class="form-select">
                    <option value="">Selecione</option>
                    <option value="MASC">Masculino</option>
                    <option value="FEM">Feminino</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Nível de atividade física</label>
                <select th:field="*{nivelAtividadeFisica}" class="form-select">
                    <option value="SEDENTARIO">Sedentário (0 Atividades)</option>
                    <option value="LEVE">Leve (1-3x por semana)</option>
                    <option value="MODERADO">Moderado (3-5x por semana)</option>
                    <option value="INTENSO">Intenso (6-7x por semana)</option>
                    <option value="MUITO_INTENSO">Muito intenso (2x por dia)</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Meta de peso desejado</label>
                <input th:field="*{meta}" type="number" step="0.1"
                       class="form-control" placeholder="Ex: 72">
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Intensidade desejada</label>
                <select th:field="*{intensidade}" class="form-select">
                    <option value="PACIFICO">Pacífica (0,38 kg/semana)</option>
                    <option value="PADRAO">Padrão (0,50 kg/semana)</option>
                    <option value="INTENSO">Intensiva (0,76 kg/semana)</option>
                </select>
            </div>

        </div>

        <div class="text-end mt-4">
            <button type="submit" class="btn btn-success px-4">
                Salvar
            </button>
        </div>

    </form>
</div>
</body>
</html>
